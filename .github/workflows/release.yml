name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          assets=()
          for target in \
            linux-amd64 linux-arm64 \
            darwin-amd64 darwin-arm64 \
            windows-amd64.exe; do
            case "$target" in
              linux-amd64) goos=linux; goarch=amd64; asset=devparity-linux-amd64 ;;
              linux-arm64) goos=linux; goarch=arm64; asset=devparity-linux-arm64 ;;
              darwin-amd64) goos=darwin; goarch=amd64; asset=devparity-darwin-amd64 ;;
              darwin-arm64) goos=darwin; goarch=arm64; asset=devparity-darwin-arm64 ;;
              windows-amd64.exe) goos=windows; goarch=amd64; asset=devparity-windows-amd64.exe ;;
            esac
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X github.com/wenn-id/devparity/internal/cli.Version=${VERSION}" \
              -o "dist/${asset}" ./cmd/devparity
            assets+=("$asset")
          done
          for asset in "${assets[@]}"; do
            if ! grep -a -F -- "$VERSION" "dist/$asset" >/dev/null; then
              echo "embedded version mismatch in $asset" >&2
              exit 1
            fi
          done
          test "$(./dist/devparity-linux-amd64 version)" = "$VERSION"
          (cd dist && sha256sum "${assets[@]}" > checksums.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: dist

  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-assets
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
