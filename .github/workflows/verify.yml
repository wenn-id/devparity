name: Verify

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build -trimpath ./cmd/devparity
      - if: runner.os == 'Linux'
        name: Verify release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          mkdir "$workdir/dist"
          cd "$workdir"
          assets=(
            devparity-linux-amd64
            devparity-linux-arm64
            devparity-darwin-amd64
            devparity-darwin-arm64
            devparity-windows-amd64.exe
          )
          for asset in "${assets[@]}"; do
            printf '%s\n' "$asset" > "dist/$asset"
          done
          (cd dist && sha256sum "${assets[@]}" > checksums.txt)
          for asset in "${assets[@]}"; do
            (cd dist && grep "  ${asset}$" checksums.txt | sha256sum -c -)
          done

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
      - run: go test ./...
        env:
          DEVPARITY_CONTAINER_TEST: "1"
